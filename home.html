<style>
  :root {
    --ink: #202a35;
    --muted: #74808c;
    --line: #e8e8e3;
    --paper: #fbfaf7;
    --white: #ffffff;

    /* Elegant burgundy palette */
    --accent: #762C46;
    --accent-dark: #552033;
    --accent-soft: #F3E7EC;

    --rose: #a65e61;
    --rose-soft: #f8eded;
  }

  body {
    background: var(--paper) !important;
    color: var(--ink) !important;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif !important;
    letter-spacing: -0.01em;
  }

  .max-w-7xl {
    max-width: 1440px !important;
  }

  header {
    border-color: var(--line) !important;
    padding-bottom: 1.5rem !important;
  }

  h1 {
    letter-spacing: -0.045em !important;
    font-weight: 650 !important;
  }

  h2 {
    letter-spacing: -0.025em !important;
  }

  header p {
    margin-top: 0.45rem;
  }

  .bg-white {
    background: var(--white) !important;
  }

  .rounded-xl {
    border-radius: 18px !important;
  }

  .rounded-lg {
    border-radius: 10px !important;
  }

  .shadow-sm {
    box-shadow: 0 8px 30px rgba(32, 42, 53, 0.045) !important;
  }

  .border,
  .border-b {
    border-color: var(--line) !important;
  }

  input,
  textarea,
  select {
    background-color: #fff !important;
    border-color: #dedfda !important;
    color: var(--ink) !important;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  input::placeholder,
  textarea::placeholder {
    color: #a1a8ad !important;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: #A66D83 !important;
    box-shadow: 0 0 0 3px rgba(118, 44, 70, 0.12) !important;
    outline: none !important;
  }

  label {
    letter-spacing: 0.09em;
    font-size: 10px !important;
  }

  button {
    transition: all 0.18s ease !important;
    cursor: pointer;
  }

  /* Burgundy primary buttons */
  #product-submit-btn,
  #category-submit-btn {
    background: var(--accent) !important;
    border-radius: 10px !important;
    box-shadow: none !important;
  }

  #product-submit-btn:hover,
  #category-submit-btn:hover {
    background: var(--accent-dark) !important;
    transform: translateY(-1px);
  }

  #product-cancel-btn,
  #category-cancel-btn {
    border-radius: 10px !important;
  }

  /* Navigation tabs */
  #tab-products-btn,
  #tab-categories-btn {
    padding: 0.85rem 1.1rem !important;
    font-size: 0.9rem;
    border-radius: 9px 9px 0 0;
  }

  .text-indigo-600 {
    color: var(--accent) !important;
  }

  .border-indigo-600 {
    border-color: var(--accent) !important;
  }

  .bg-indigo-600 {
    background: var(--accent) !important;
  }

  .hover\:bg-indigo-700:hover {
    background: var(--accent-dark) !important;
  }

  .focus\:ring-indigo-500:focus {
    --tw-ring-color: rgba(118, 44, 70, 0.22) !important;
  }

  #tab-products-btn:hover,
  #tab-categories-btn:hover {
    color: var(--accent) !important;
  }

  /* Clean tables */
  table {
    border-spacing: 0;
  }

  thead tr {
    border-color: var(--line) !important;
  }

  th {
    font-size: 10px !important;
    letter-spacing: 0.1em;
    font-weight: 650 !important;
    color: #8a9297 !important;
    padding-top: 0.9rem !important;
    padding-bottom: 0.9rem !important;
  }

  td {
    padding-top: 1rem !important;
    padding-bottom: 1rem !important;
  }

  tbody tr {
    transition: background 0.15s ease;
  }

  /* Category badges */
  .bg-blue-50 {
    background: var(--accent-soft) !important;
  }

  .text-blue-700 {
    color: var(--accent-dark) !important;
  }

  .border-blue-200 {
    border-color: #E6CFD8 !important;
  }

  /* Stock status remains easy to recognize */
  .bg-green-100 {
    background: #e7f2e9 !important;
  }

  .text-green-700 {
    color: #38664a !important;
  }

  /* Delete actions */
  .bg-red-100 {
    background: var(--rose-soft) !important;
  }

  .text-red-700,
  .text-red-500 {
    color: var(--rose) !important;
  }

  .hover\:text-red-700:hover {
    color: #874548 !important;
  }

  /* Typography */
  .text-gray-900,
  .text-gray-800 {
    color: var(--ink) !important;
  }

  .text-gray-500,
  .text-gray-400 {
    color: var(--muted) !important;
  }

  /* Refresh button */
  header button {
    background: #f0f0eb !important;
    border-radius: 10px !important;
    color: #46515a !important;
  }

  header button:hover {
    background: #e7e8e1 !important;
  }

  /* Mobile responsive design */
  @media (max-width: 640px) {
    .max-w-7xl {
      padding: 1rem !important;
    }

    header {
      align-items: flex-start !important;
      gap: 1rem;
      flex-direction: column;
    }

    h1 {
      font-size: 1.8rem !important;
    }

    #tab-products-btn,
    #tab-categories-btn {
      padding: 0.75rem 0.6rem !important;
      font-size: 0.8rem;
    }

    section {
      gap: 1rem !important;
    }

    .p-6 {
      padding: 1.1rem !important;
    }
  }
</style>
